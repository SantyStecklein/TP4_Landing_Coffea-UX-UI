<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada | Coffea</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .error-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: var(--color-bg); text-align: center; padding: 20px; }
    .error-title { font-family: var(--font-display); font-size: var(--fs-hero); color: var(--color-espresso); margin-bottom: 20px; }
    .error-desc { font-family: var(--font-body); font-size: var(--fs-md); color: var(--color-espresso); margin-bottom: 40px; }
    .error-btn { display: inline-block; background-color: var(--color-espresso); color: var(--color-bg); font-family: var(--font-body); padding: 16px 40px; border-radius: var(--radius-pill); text-decoration: none; }
  </style>
</head>
<body>
  <main class="error-page">
    <h1 class="error-title">404</h1>
    <p class="error-desc">Oops! The coffee you are looking for has been spilled.</p>
    <a href="/" class="error-btn">Return to Home</a>
  </main>
</body>
</html>
