[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "18"

# Desactivar la inyección automática del snippet/HUD de Netlify en las páginas HTML
[template.environment]
  NETLIFY_BUILD_PAGES_DEVEL = "false"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"